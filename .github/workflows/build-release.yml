name: build-release-package
on:
  workflow_call:
    inputs: &package_inputs
      runner:
        type: string
        required: true
      platform:
        type: string
        required: true
      arch:
        type: string
        required: true
      triplet:
        type: string
        default: ''
  workflow_dispatch:
    inputs: *package_inputs
permissions:
  contents: read
jobs:
  package:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
    env:
      VCPKG_DISABLE_METRICS: '1'
      BRIDGE_CI_DIST: ${{ github.workspace }}/dist
      BRIDGE_CI_ARCH: ${{ inputs.arch }}
      BRIDGE_PLATFORM: ${{ inputs.platform }}
      BRIDGE_TRIPLET: ${{ inputs.triplet }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Select disposable build directories
        run: |
          echo "VCPKG_BINARY_SOURCES=clear;files,$RUNNER_TEMP/vcpkg-binary-cache,readwrite" >> "$GITHUB_ENV"
          echo "BRIDGE_CI_BUILD=$RUNNER_TEMP/bridge-release" >> "$GITHUB_ENV"
      - name: Validate source version and tooling
        run: |
          python .github/package.py version
          python -m unittest discover -s tests/tooling
      - name: Build and package Ubuntu runtime dependencies
        if: inputs.platform == 'linux'
        run: bash .github/ci-linux.sh
      - name: Configure native Windows compiler
        if: inputs.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: ${{ inputs.arch == 'arm64' && 'arm64' || 'amd64' }}
      - name: Select macOS C++23 toolchain
        if: inputs.platform == 'macos'
        run: |
          export DEVELOPER_DIR=/Applications/Xcode_26.0.1.app/Contents/Developer
          test -d "$DEVELOPER_DIR"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          brew install ninja autoconf autoconf-archive automake libtool
          echo "CC=$(xcrun --find clang)" >> "$GITHUB_ENV"
          echo "CXX=$(xcrun --find clang++)" >> "$GITHUB_ENV"
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
          echo "MACOSX_DEPLOYMENT_TARGET=14.0" >> "$GITHUB_ENV"
          "$(xcrun --find clang++)" -std=c++23 -mmacosx-version-min=14.0 \
            -isysroot "$(xcrun --sdk macosx --show-sdk-path)" \
            cmake/checks/standard_library.cpp -o "$RUNNER_TEMP/bridge-toolchain-check"
          "$RUNNER_TEMP/bridge-toolchain-check"
      - name: Select pinned SDK location after compiler setup
        if: inputs.platform != 'linux'
        run: |
          # Visual Studio exports its own VCPKG_ROOT; use our pinned checkout.
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg-bridge" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: sdk-cache
        if: inputs.platform != 'linux'
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: sdk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json', format('cmake/release-triplets/{0}.cmake', inputs.triplet)) }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            sdk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json', format('cmake/release-triplets/{0}.cmake', inputs.triplet)) }}-
            sdk-${{ runner.os }}-${{ runner.arch }}-
      - name: Bootstrap pinned vcpkg
        if: inputs.platform != 'linux'
        run: |
          git clone --filter=blob:none https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout 44819aa2a6c10e56065e2b0330e7d6c89d1d2574
          if [[ "$RUNNER_OS" == Windows ]]; then
            "$VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics
          else
            "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          fi
      - name: Build and test native shared-runtime SDK
        if: inputs.platform != 'linux'
        run: |
          cmake --preset release -B "$BRIDGE_CI_BUILD" \
            -DVCPKG_TARGET_TRIPLET="$BRIDGE_TRIPLET" \
            -DVCPKG_HOST_TRIPLET="$BRIDGE_TRIPLET" \
            -DVCPKG_INSTALLED_DIR="$RUNNER_TEMP/vcpkg-installed" \
            -DVCPKG_OVERLAY_TRIPLETS="$GITHUB_WORKSPACE/cmake/release-triplets"
          cmake --build "$BRIDGE_CI_BUILD" --parallel 2
          bridge_sdk="$RUNNER_TEMP/vcpkg-installed/$BRIDGE_TRIPLET"
          bridge_sdk_bin="$bridge_sdk/bin"
          bridge_test_logging=()
          if [[ "$RUNNER_OS" == Windows ]]; then
            bridge_sdk_bin="$(cygpath -u "$bridge_sdk_bin")"
            bridge_test_logging+=(QT_FORCE_STDERR_LOGGING=1 QT_DEBUG_PLUGINS=1)
            MSYS2_ARG_CONV_EXCL=/DEPENDENTS dumpbin /DEPENDENTS "$BRIDGE_CI_BUILD/bridge_gui.exe"
          fi
          env "${bridge_test_logging[@]}" QT_PLUGIN_PATH="$bridge_sdk/Qt6/plugins" \
            QML_IMPORT_PATH="$bridge_sdk/Qt6/qml" \
            PATH="$bridge_sdk_bin:$PATH" \
            python .github/package.py test --build "$BRIDGE_CI_BUILD"
          python .github/package.py package --build "$BRIDGE_CI_BUILD" --output "$BRIDGE_CI_DIST" \
            --platform "$BRIDGE_PLATFORM" --arch "$BRIDGE_CI_ARCH" \
            --sdk "$RUNNER_TEMP/vcpkg-installed/$BRIDGE_TRIPLET"
      - name: Diagnose a failed Windows TLS check
        if: failure() && inputs.platform == 'windows'
        timeout-minutes: 4
        run: |
          bridge_sdk="$RUNNER_TEMP/vcpkg-installed/$BRIDGE_TRIPLET"
          env QT_FORCE_STDERR_LOGGING=1 QT_DEBUG_PLUGINS=1 \
            QT_LOGGING_RULES='qt.network.ssl=true' \
            QT_PLUGIN_PATH="$bridge_sdk/Qt6/plugins" \
            PATH="$(cygpath -u "$bridge_sdk/bin"):$PATH" \
            python .github/package.py diagnose-windows --build "$BRIDGE_CI_BUILD"
          env PATH="$(cygpath -u "$bridge_sdk/bin"):$PATH" \
            python .github/openssl-tls-probe.py "$bridge_sdk"
      - name: Preserve completed SDK packages for retries
        if: always() && inputs.platform != 'linux'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: ${{ steps.sdk-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bridge-${{ inputs.platform }}-${{ inputs.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
