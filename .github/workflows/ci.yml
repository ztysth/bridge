name: native-validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    if: github.event_name != 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, platform: linux, arch: x86_64, triplet: ''}
          - {runner: windows-2022, platform: windows, arch: x86_64, triplet: x64-windows}
          - {runner: macos-15, platform: macos, arch: arm64, triplet: arm64-osx-dynamic}
    uses: ./.github/workflows/build-release.yml
    with:
      runner: ${{ matrix.runner }}
      platform: ${{ matrix.platform }}
      arch: ${{ matrix.arch }}
      triplet: ${{ matrix.triplet }}
  diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BRIDGE_CI_ARCH: x86_64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Select disposable build directories
        run: |
          echo "BRIDGE_BUILD_ROOT=$RUNNER_TEMP/bridge-diagnostics" >> "$GITHUB_ENV"
          echo "BRIDGE_CI_BUILD=$RUNNER_TEMP/bridge-package-check" >> "$GITHUB_ENV"
          echo "BRIDGE_CI_DIST=$RUNNER_TEMP/bridge-artifacts" >> "$GITHUB_ENV"
      - name: Build, test and validate installed DEB
        run: bash .github/ci-linux.sh
      - name: Formatting, analysis, sanitizers and Memcheck
        run: |
          sudo apt-get install -y clang-format-18 clang-tidy-19 valgrind
          cmake --preset lint-system -B "$BRIDGE_BUILD_ROOT/lint-system"
          cmake --build "$BRIDGE_BUILD_ROOT/lint-system" --parallel 2
          cmake --build "$BRIDGE_BUILD_ROOT/lint-system" --target format-check memcheck
          for preset in asan-system ubsan-system; do
            cmake --preset "$preset" -B "$BRIDGE_BUILD_ROOT/$preset"
            cmake --build "$BRIDGE_BUILD_ROOT/$preset" --parallel 2
            ctest --test-dir "$BRIDGE_BUILD_ROOT/$preset" --output-on-failure
          done
